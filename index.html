<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gideon Rental Property Manager — OneDrive Links</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1b3040;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#173a4a;color:white;padding:20px max(18px,calc((100vw - 1200px)/2))}h1{font-size:1.55rem;margin:0}header small{color:#d1e2e9}main{max-width:1200px;margin:auto;padding:20px}nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}button,.button{border:0;background:#176b83;color:white;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer}button:hover{filter:brightness(.94)}nav button{background:white;color:#24465b;border:1px solid #d0dce3}nav button.active{background:#176b83;color:white}.secondary{background:#e5edf1;color:#1a4658}.danger{background:#a93636}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.card,.panel{background:white;border:1px solid #dce5ea;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #102b3b0a}.panel{padding:18px;margin-bottom:16px}.card .body{padding:14px}.photo{height:175px;background:#e4edf0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo .placeholder{text-align:center;color:#69818d;font-size:14px}.photo .placeholder b{font-size:42px;display:block;font-weight:400}.photo label{position:absolute;right:8px;bottom:8px;background:#ffffffee;color:#153f51;border-radius:7px;padding:7px 9px;font-size:12px;cursor:pointer;font-weight:700}.photo input{display:none}.metric{background:white;padding:17px;border-radius:12px;border:1px solid #dce5ea}.metric b{font-size:25px;display:block;margin-top:6px}.muted{color:#667c87;font-size:13px}.pill{font-size:12px;border-radius:20px;padding:4px 8px;display:inline-block;background:#e9eef1;color:#455e6b}.good{background:#dff4e7;color:#17603a}.warn{background:#fff0cf;color:#8c5c00}.bad{background:#fbe1e1;color:#a12e2e}h2{font-size:20px;margin:4px 0 15px}h3{margin:0 0 10px}p{line-height:1.5}input,select,textarea{width:100%;border:1px solid #c9d7df;border-radius:8px;padding:10px;font:inherit;background:white;color:#1b3040}label.field{font-size:13px;font-weight:650;display:block;margin-bottom:4px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e5edf1;padding:11px 9px;white-space:nowrap}th{background:#f5f8fa}td button{padding:6px 9px;font-size:12px}.notice{border-left:4px solid #c18a2b;background:#fff8e9;padding:12px;margin-bottom:15px;border-radius:6px}.empty{padding:20px;text-align:center;color:#68808d}.subtle{font-size:12px;color:#6e8088}section{margin-bottom:18px}.unitbutton{padding:7px 10px;font-size:12px}.stack{display:grid;gap:9px}.task{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e6edf1;padding:10px 0}.task:last-child{border:0}@media(max-width:600px){main{padding:12px}header{padding:17px}h1{font-size:1.25rem}.photo{height:195px}}
</style><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>#loginGate{position:fixed;inset:0;background:#f3f6f8;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}#loginGate .panel{width:min(440px,100%)}#syncStatus{font-size:12px;margin-left:10px;color:#d1e2e9}#logoutBtn{background:#e5edf1;color:#173a4a;padding:6px 9px;margin-left:10px;font-size:12px}</style></head><body><header><h1>🏡 Gideon Rental Property Manager</h1><small>7 rental units · Forsyth, Missouri · Private cloud sync <span id="syncStatus">Connecting…</span><button id="logoutBtn" style="display:none" onclick="firebase.auth().signOut()">Sign out</button></small></header><main><nav id="nav"></nav><div id="app"></div></main><div id="loginGate"><div class="panel"><h2>Gideon Rental Property Manager</h2><p>Sign in with your authorized rental manager account.</p><form id="loginForm"><label class="field">Email</label><input id="loginEmail" type="email" autocomplete="username" required><label class="field" style="margin-top:12px">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required><div class="actions"><button type="submit">Sign in</button></div></form><p class="muted" id="loginMessage">Waiting for Firebase…</p></div></div><script>
'use strict';const KEY='gideon-rental-preview-v2';const addresses=['130 Tower Road','132 Tower Road','148 Tower Road','150 Tower Road','117 Division Street','119 Division Street','131 Division Street'];const buildings=['Duplex 1','Duplex 1','Duplex 2','Duplex 2','Duplex 3','Duplex 3','Single-family house'];const tasks=[['HVAC filter',90],['HVAC service',182],['Smoke/CO detector test',182],['Smoke detector batteries',365],['Water heater inspection',365],['Dryer vent cleaning',365],['Property inspection',365]];
const blank=()=>({units:addresses.map((address,i)=>({id:i+1,address,building:buildings[i],photo:'',photoLink:'',tenant:'',phone:'',email:'',rent:'',dueDay:1,deposit:'',start:'',end:'',notice:'',rentIncrease:'',history:[],maintenance:{},documents:{lease:[],checkin:[]},onedriveDocuments:{lease:[],checkin:[]},lateOverride:''})),payments:[],expenses:[],settings:{grace:3,lateDaily:5}});let state;try{state=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){state=blank()}let tab='Dashboard',selected=1;const $=s=>document.querySelector(s);const today=()=>new Date().toLocaleDateString('en-CA');const date=s=>s?new Date(s+'T12:00:00'):null;const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const addDays=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return iso(d)};const addYear=s=>{let d=date(s);d.setFullYear(d.getFullYear()+1);return iso(d)};const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const unit=id=>state.units.find(u=>u.id===Number(id));const save=()=>{if(!cloudReady){alert('Cloud data is not ready. Please sign in and wait for synchronization.');return}queueCloudSave()};const monthsAgo=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;const ym=()=>today().slice(0,7);const sum=(a)=>a.reduce((s,v)=>s+Number(v||0),0);const payments=(id,month)=>state.payments.filter(p=>p.unit===id&&p.month===month);const paid=(id,month)=>sum(payments(id,month).map(p=>p.amount));const expenses=(id,month)=>state.expenses.filter(e=>(!id||e.unit===id)&&(!month||e.date.slice(0,7)===month));const diff=s=>Math.ceil((date(s)-date(today()))/86400000);const f=(name,val,type='text',attrs='')=>`<div><label class="field">${name}</label><input type="${type}" value="${esc(val)}" ${attrs}></div>`;function dueDate(u,month){let [y,m]=month.split('-').map(Number);return iso(new Date(y,m-1,Math.min(Number(u.dueDay)||1,new Date(y,m,0).getDate())))}function rentStatus(u,month){if(!Number(u.rent))return {label:'Rent not set',cls:'',balance:0,late:0};let balance=Math.max(0,Number(u.rent)-paid(u.id,month)),due=dueDate(u,month),days=Math.max(0,-diff(due)-Number(state.settings.grace));let late=balance>0?days*Number(state.settings.lateDaily):0;if(u.lateOverride!=='')late=Number(u.lateOverride);return {label:balance===0?'Paid':paid(u.id,month)>0?'Partial':days>0?'Overdue':'Unpaid',cls:balance===0?'good':days>0?'bad':'warn',balance,late}}function leaseInfo(u){if(!u.end)return {label:'Not entered',cls:'',end:''};if(u.notice)return {label:'Notice recorded',cls:'warn',end:u.end};let d=diff(u.end);if(d<0)return {label:'Review renewal',cls:'warn',end:u.end};return {label:d<=30?'30-day notice window':d<=45?'45-day reminder':'Active',cls:d<=45?'warn':'good',end:u.end}}
function nav(){let tabs=['Dashboard','Properties','Rent Payments','Expenses','Maintenance','Reports','Backup'];$('#nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}function go(t){tab=t;render()}function render(){nav();$('#app').innerHTML=({Dashboard:dashboard,Properties:properties,'Rent Payments':rentPage,Expenses:expensePage,Maintenance:maintenancePage,Reports:reports,Backup:backup})[tab]();}
function dashboard(){let month=ym(),rents=sum(state.units.map(u=>u.rent)),collected=sum(state.units.map(u=>paid(u.id,month))),exp=sum(expenses(null,month).map(e=>e.amount)),occupied=state.units.filter(u=>u.tenant.trim()).length;let alerts=[];state.units.forEach(u=>{let l=leaseInfo(u);if(l.cls==='warn')alerts.push(`<div class="task"><span><b>${esc(u.address)}</b> · Lease: ${esc(l.label)} ${esc(l.end)}</span><button class="secondary" onclick="openUnit(${u.id})">Open</button></div>`);tasks.forEach(([name,interval])=>{let last=u.maintenance?.[name];if(!last)return;let next=addDays(last,interval),d=diff(next);if(d<=7)alerts.push(`<div class="task"><span><b>${esc(u.address)}</b> · ${esc(name)} <span class="pill ${d<0?'bad':'warn'}">${d<0?'Overdue':'Due soon'} · ${next}</span></span><button class="secondary" onclick="openUnit(${u.id})">Open</button></div>`)});});return `<div class="notice"><b>OneDrive links enabled:</b> Store links to your private OneDrive photos and signed documents. Share each file with Joe and Kim only. Files remain in OneDrive; links sync through Firebase.</div><div class="grid" style="margin-bottom:18px"><div class="metric">Monthly scheduled rent<b>${money(rents)}</b></div><div class="metric">Collected this month<b>${money(collected)}</b></div><div class="metric">Expenses this month<b>${money(exp)}</b></div><div class="metric">Units with tenants<b>${occupied} / 7</b></div></div><section class="panel"><div class="row"><h2>Reminders</h2><span class="pill">Shown when you open the app</span></div>${alerts.length?alerts.join(''):'<p class="muted">No upcoming reminders yet. Enter lease dates and last maintenance dates after cloud syncing is enabled.</p>'}</section><h2>Your Rental Units</h2>${cards()}`}
function cards(){return `<div class="grid">${state.units.map(u=>{let rs=rentStatus(u,ym());return `<div class="card"><div class="photo">${u.photo?`<img src="${u.photo}" alt="Photo of ${esc(u.address)}">`:'<div class="placeholder"><b>⌂</b>No property photo yet</div>'}<label onclick="setPhotoLink(${u.id})">🔗 Photo link</label></div><div class="body">${u.photoLink?`<button class="secondary" onclick="openPhotoLink(${u.id})" style="margin-bottom:10px">View OneDrive photo</button>`:''}<div class="row"><b>${esc(u.address)}</b><span class="pill ${rs.cls}">${rs.label}</span></div><div class="muted">${esc(u.building)} · Forsyth, MO</div><p style="margin:10px 0">${esc(u.tenant||'Tenant not entered')}<br><b>${u.rent?money(u.rent)+'/month':'Rent not entered'}</b></p><button class="unitbutton" onclick="openUnit(${u.id})">Open Unit Details</button></div></div>`}).join('')}</div>`}
function properties(){return `<h2>Properties</h2>${cards()}`}
function openUnit(id){selected=id;tab='Properties';nav();$('#app').innerHTML=unitPage(unit(id));window.scrollTo(0,0)}
function unitPage(u){let l=leaseInfo(u),rs=rentStatus(u,ym());return `<div class="actions"><button class="secondary" onclick="render()">← All properties</button></div><h2 style="margin-top:16px">${esc(u.address)} · ${esc(u.building)}</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><div class="photo" style="height:260px">${u.photo?`<img src="${u.photo}" alt="Property photo">`:'<div class="placeholder"><b>⌂</b>No embedded photo</div>'}<label onclick="setPhotoLink(${u.id})">🔗 Photo link</label></div><div class="body">${u.photoLink?`<button class="secondary" onclick="openPhotoLink(${u.id})">Open property photo in OneDrive</button>`:''}<p><span class="pill ${rs.cls}">${rs.label}</span> <span class="pill ${l.cls}">${l.label}</span></p><b>Current month rent: ${money(u.rent)}</b><p class="muted">Unpaid: ${money(rs.balance)} · Estimated late fee: ${money(rs.late)}</p></div></div><div class="panel"><h3>Tenant & Lease Details</h3><div class="formgrid">${f('Tenant name',u.tenant,'text','id="tenant"')}${f('Phone',u.phone,'tel','id="phone"')}${f('Email',u.email,'email','id="email"')}${f('Monthly rent ($)',u.rent,'number','id="rent" min="0" step="0.01"')}${f('Rent due day of month',u.dueDay,'number','id="dueDay" min="1" max="31"')}${f('Security deposit ($)',u.deposit,'number','id="deposit" min="0" step="0.01"')}${f('Lease start date',u.start,'date','id="start"')}${f('Current lease expiration',u.end,'date','id="end"')}${f('Nonrenewal notice received',u.notice,'date','id="notice"')}${f('Late fee override ($, optional)',u.lateOverride,'number','id="lateOverride" min="0" step="0.01"')}</div><div class="actions"><button onclick="saveUnit(${u.id})">Save Unit Details</button><button class="secondary" onclick="renew(${u.id})">Record 12-month Renewal</button></div><p class="subtle">Annual leases; 30-day nonrenewal notice; same rent unless changed. Automatic renewals require review before recording.</p></div></div><div class="panel"><h3>Lease Renewal History</h3>${u.history?.length?`<div class="tablewrap"><table><tr><th>Recorded</th><th>Previous expiration</th><th>New expiration</th><th>Old rent</th><th>New rent</th></tr>${u.history.map(h=>`<tr><td>${h.recorded}</td><td>${h.oldEnd}</td><td>${h.newEnd}</td><td>${money(h.oldRent)}</td><td>${money(h.newRent)}</td></tr>`).join('')}</table></div>`:'<p class="muted">No renewals recorded yet.</p>'}</div>${docSection(u)}<div class="panel"><h3>Maintenance for This Unit</h3><div class="formgrid">${tasks.map(([name,days],i)=>`<div><label class="field">${name} · every ${days} days</label><input type="date" id="task${i}" value="${esc(u.maintenance?.[name]||'')}"><span class="subtle">${u.maintenance?.[name]?'Next: '+addDays(u.maintenance[name],days):'No last completed date entered'}</span></div>`).join('')}</div><div class="actions"><button onclick="saveTasks(${u.id})">Save Maintenance Dates</button><button class="secondary" onclick="markFilter(${u.id})">HVAC Filter Changed Today</button></div></div>`}
function docSection(u){let docs=u.onedriveDocuments||{lease:[],checkin:[]};return `<div class="panel"><h3>Signed Documents — OneDrive</h3><p class="muted">Keep the original documents in your private OneDrive folder. Paste a sharing link restricted to Joe and Kim; do not select “Anyone with the link.”</p>${[['lease','Signed Leases'],['checkin','Signed Check-In Sheets']].map(([key,title])=>`<div style="padding:12px 0;border-top:1px solid #e5edf1"><div class="row"><b>${title}</b><button class="secondary" onclick="addOneDriveDocument(${u.id},'${key}')">+ Add OneDrive link</button></div>${(docs[key]||[]).length?`<div class="stack" style="margin-top:9px">${docs[key].map((d,i)=>`<div class="row"><span>${esc(d.name)} <small class="muted">· ${esc(d.added||'')}</small></span><span><button class="secondary" onclick="openOneDriveDocument(${u.id},'${key}',${i})">Open in OneDrive</button> <button class="danger" onclick="removeOneDriveDocument(${u.id},'${key}',${i})">Remove link</button></span></div>`).join('')}</div>`:'<p class="muted">No OneDrive links saved.</p>'}</div>`).join('')}</div>`}
function validOneDriveLink(value){try{let u=new URL(value);return u.protocol==='https:' && (u.hostname==='1drv.ms'||u.hostname==='onedrive.live.com'||u.hostname==='www.onedrive.live.com'||u.hostname==='onedrive.com'||u.hostname==='www.onedrive.com'||u.hostname==='sharepoint.com'||u.hostname.endsWith('.sharepoint.com'))}catch(e){return false}}
function openOneDriveUrl(url){if(!validOneDriveLink(url)){alert('This is not a recognized secure OneDrive link.');return}window.open(url,'_blank','noopener,noreferrer')}
function setPhotoLink(id){let u=unit(id),url=prompt('Paste the private OneDrive sharing link for the property photo. Only Joe and Kim should have access:',u.photoLink||'');if(url===null)return;url=url.trim();if(url&&!validOneDriveLink(url)){alert('Please paste a valid HTTPS OneDrive sharing link.');return}u.photoLink=url;save();openUnit(id)}
function openPhotoLink(id){let u=unit(id);if(u?.photoLink)openOneDriveUrl(u.photoLink)}
function addOneDriveDocument(id,key){let u=unit(id);let name=prompt('Document description (for example: Signed lease 2026):');if(name===null)return;name=name.trim();if(!name){alert('Enter a document description.');return}let url=prompt('Paste the private OneDrive sharing link for this document:');if(url===null)return;url=url.trim();if(!validOneDriveLink(url)){alert('Please paste a valid HTTPS OneDrive sharing link.');return}u.onedriveDocuments ||= {lease:[],checkin:[]};u.onedriveDocuments[key] ||= [];u.onedriveDocuments[key].push({name,url,added:today()});save();openUnit(id)}
function openOneDriveDocument(id,key,index){let d=unit(id)?.onedriveDocuments?.[key]?.[index];if(d)openOneDriveUrl(d.url)}
function removeOneDriveDocument(id,key,index){if(!confirm('Remove this link from the app? The file will remain in OneDrive.'))return;unit(id).onedriveDocuments[key].splice(index,1);save();openUnit(id)}

function uploadDocument(e,id,key){alert('Signed document uploads are disabled until secure Firebase Storage is configured.');e.target.value='';return;const file=e.target.files?.[0];if(!file)return;if(!['application/pdf','image/jpeg','image/png'].includes(file.type)){alert('Please use PDF, JPG or PNG.');return}if(file.size>1500000){alert('For this local preview, files must be under 1.5 MB. The hosted version will support larger files.');return}let reader=new FileReader();reader.onload=()=>{let u=unit(id);u.documents ||= {lease:[],checkin:[]};u.documents[key] ||= [];u.documents[key].push({name:file.name,uploaded:today(),type:file.type,data:reader.result});save();openUnit(id)};reader.readAsDataURL(file)}
function viewDocument(id,key,index){let d=unit(id)?.documents?.[key]?.[index];if(!d)return;let a=document.createElement('a');a.href=d.data;a.download=d.name;document.body.append(a);a.click();a.remove()}
function deleteDocument(id,key,index){if(!confirm('Remove this uploaded document?'))return;unit(id).documents[key].splice(index,1);save();openUnit(id)}
function saveUnit(id){let u=unit(id);['tenant','phone','email','rent','dueDay','deposit','start','end','notice','lateOverride'].forEach(k=>u[k]=$('#'+k).value);u.dueDay=Math.min(31,Math.max(1,Number(u.dueDay)||1));save();openUnit(id)}function renew(id){let u=unit(id);if(!u.end)return alert('Enter the current lease expiration date first.');if(u.notice)return alert('Nonrenewal notice is recorded. Review or clear it before renewing.');let oldEnd=u.end,oldRent=u.rent,newEnd=addYear(oldEnd);let newRent=prompt('Monthly rent for renewed lease:',u.rent||'0');if(newRent===null)return;if(!confirm(`Record renewal for ${u.address} through ${newEnd} at ${money(newRent)}/month? Confirm the lease terms before proceeding.`))return;u.history=u.history||[];u.history.unshift({recorded:today(),oldEnd,newEnd,oldRent,newRent});u.end=newEnd;u.rent=Number(newRent);save();openUnit(id)}function saveTasks(id){let u=unit(id);u.maintenance=u.maintenance||{};tasks.forEach(([name],i)=>{u.maintenance[name]=$('#task'+i).value});save();openUnit(id)}function markFilter(id){let u=unit(id);u.maintenance=u.maintenance||{};u.maintenance['HVAC filter']=today();save();openUnit(id)}
function photoUpload(e,id){alert('Photo uploads are temporarily disabled until cloud file storage is configured.');e.target.value='';return;let file=e.target.files?.[0];if(!file)return;let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1000/img.width,800/img.height),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);unit(id).photo=canvas.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);save();if($('#app').querySelector('#tenant'))openUnit(id);else render()};img.onerror=()=>alert('Could not read photo. Try a JPG image.');img.src=url}
function rentPage(){let month=window.rentMonth||ym();return `<div class="row"><h2>Rent Payments</h2><div><label class="field">Payment month</label><input type="month" value="${month}" onchange="window.rentMonth=this.value;render()"></div></div><div class="panel"><div class="tablewrap"><table><tr><th>Address</th><th>Tenant</th><th>Due</th><th>Rent</th><th>Received</th><th>Unpaid</th><th>Late fee*</th><th>Status</th></tr>${state.units.map(u=>{let r=rentStatus(u,month);return `<tr><td>${esc(u.address)}</td><td>${esc(u.tenant||'—')}</td><td>${dueDate(u,month)}</td><td>${money(u.rent)}</td><td>${money(paid(u.id,month))}</td><td>${money(r.balance)}</td><td>${money(r.late)}</td><td><span class="pill ${r.cls}">${r.label}</span></td></tr>`}).join('')}</table></div><p class="subtle">*Late fees are estimates based on current unpaid rent and the 3-day grace period. Historical late fees may require manual adjustment for partial payments, waivers, and lease terms.</p></div><div class="panel"><h3>Record a Rent Payment</h3><form onsubmit="addPayment(event)"><div class="formgrid"><div><label class="field">Unit</label><select name="unit">${state.units.map(u=>`<option value="${u.id}">${esc(u.address)}</option>`).join('')}</select></div>${f('Rent month',month,'month','name="month" required')}${f('Payment date',today(),'date','name="date" required')}${f('Amount received ($)','','number','name="amount" required min="0.01" step="0.01"')}<div><label class="field">Payment method</label><select name="method"><option>Check</option><option>Cash</option><option>Bank transfer</option><option>Other</option></select></div>${f('Notes','','text','name="note"')}</div><button type="submit">Save Payment</button></form></div><div class="panel"><h3>Payment History</h3>${state.payments.length?`<div class="tablewrap"><table><tr><th>Received</th><th>Unit</th><th>For month</th><th>Amount</th><th>Method</th><th></th></tr>${[...state.payments].reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(unit(p.unit)?.address)}</td><td>${p.month}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td><button class="danger" onclick="removePayment('${p.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<p class="muted">No payments recorded yet.</p>'}</div>`}
function addPayment(e){e.preventDefault();let d=new FormData(e.target);state.payments.push({id:String(Date.now()),unit:Number(d.get('unit')),month:d.get('month'),date:d.get('date'),amount:Number(d.get('amount')),method:d.get('method'),note:d.get('note')});save();render()}function removePayment(id){if(confirm('Delete this payment record?')){state.payments=state.payments.filter(p=>p.id!==id);save();render()}}
function expensePage(){return `<h2>Expenses</h2><div class="panel"><h3>Add an Expense</h3><form onsubmit="addExpense(event)"><div class="formgrid"><div><label class="field">Unit</label><select name="unit">${state.units.map(u=>`<option value="${u.id}">${esc(u.address)}</option>`).join('')}</select></div>${f('Date',today(),'date','name="date" required')}<div><label class="field">Category</label><select name="category">${['Repairs','Maintenance','Property taxes','Insurance','Utilities','Mortgage interest','Supplies','Improvements','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div>${f('Amount ($)','','number','name="amount" required min="0" step="0.01"')}${f('Description','','text','name="note"')}</div><button type="submit">Save Expense</button></form></div><div class="panel"><h3>Expense History</h3>${state.expenses.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Unit</th><th>Category</th><th>Amount</th><th>Description</th><th></th></tr>${[...state.expenses].reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(unit(e.unit)?.address)}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${esc(e.note)}</td><td><button class="danger" onclick="removeExpense('${e.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<p class="muted">No expenses recorded yet.</p>'}</div>`}function addExpense(e){e.preventDefault();let d=new FormData(e.target);state.expenses.push({id:String(Date.now()),unit:Number(d.get('unit')),date:d.get('date'),category:d.get('category'),amount:Number(d.get('amount')),note:d.get('note')});save();render()}function removeExpense(id){if(confirm('Delete this expense?')){state.expenses=state.expenses.filter(e=>e.id!==id);save();render()}}
function maintenancePage(){return `<h2>Preventive Maintenance</h2><div class="panel"><p>HVAC filters are scheduled every <b>90 days</b>. Other maintenance schedules can be reviewed for each unit. Reminders appear only inside this app.</p><div class="tablewrap"><table><tr><th>Unit</th><th>Maintenance</th><th>Last completed</th><th>Next due</th><th>Status</th><th></th></tr>${state.units.flatMap(u=>tasks.map(([name,interval])=>{let last=u.maintenance?.[name],next=last?addDays(last,interval):'',d=next?diff(next):null;return `<tr><td>${esc(u.address)}</td><td>${name}</td><td>${last||'Not set'}</td><td>${next||'—'}</td><td><span class="pill ${d===null?'':d<0?'bad':d<=7?'warn':'good'}">${d===null?'Set date':d<0?'Overdue':d<=7?'Due soon':'Current'}</span></td><td><button class="secondary" onclick="openUnit(${u.id})">Update</button></td></tr>`})).join('')}</table></div></div>`}
function reports(){let year=window.reportYear||today().slice(0,4);let annual=state.units.map(u=>{let p=sum(state.payments.filter(p=>p.unit===u.id&&p.month.startsWith(year)).map(p=>p.amount)),e=sum(expenses(u.id).filter(e=>e.date.startsWith(year)).map(e=>e.amount));return {u,p,e}});return `<div class="row"><h2>Financial Reports</h2><div><label class="field">Year</label><input type="number" min="2000" max="2100" value="${year}" onchange="window.reportYear=this.value;render()"></div></div><div class="grid" style="margin-bottom:15px"><div class="metric">Rent collected<b>${money(sum(annual.map(x=>x.p)))}</b></div><div class="metric">Recorded expenses<b>${money(sum(annual.map(x=>x.e)))}</b></div><div class="metric">Net recorded cash flow<b>${money(sum(annual.map(x=>x.p-x.e)))}</b></div></div><div class="panel"><h3>By Rental Unit</h3><div class="tablewrap"><table><tr><th>Unit</th><th>Rent collected</th><th>Expenses</th><th>Net cash flow</th></tr>${annual.map(x=>`<tr><td>${esc(x.u.address)}</td><td>${money(x.p)}</td><td>${money(x.e)}</td><td>${money(x.p-x.e)}</td></tr>`).join('')}</table></div><p class="subtle">Cash-flow summary only. Not a tax return; excludes unrecorded costs and depreciation.</p></div><button onclick="exportCSV()">Export Report CSV</button>`}
function exportCSV(){let y=window.reportYear||today().slice(0,4),rows=[['Address','Year','Rent Collected','Expenses','Net Cash Flow']];state.units.forEach(u=>{let p=sum(state.payments.filter(p=>p.unit===u.id&&p.month.startsWith(y)).map(p=>p.amount)),e=sum(expenses(u.id).filter(x=>x.date.startsWith(y)).map(x=>x.amount));rows.push([u.address,y,p,e,p-e])});download(new Blob([rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}),`gideon-report-${y}.csv`)}function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}function backup(){return `<h2>Backup & Restore</h2><div class="panel"><h3>Save a Backup</h3><p>Download a JSON backup containing your shared property records, tenants, payments, expenses and maintenance dates. Keep it in a safe location.</p><button onclick="download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'Gideon_Rental_Backup_'+today()+'.json')">Download Backup</button></div><div class="panel"><h3>Restore a Backup</h3><p class="muted">Restoring replaces all data currently stored in this browser.</p><input type="file" accept=".json,application/json" onchange="restore(event)"></div><div class="panel"><h3>About This Preview</h3><p>Shared rental records sync through Firebase after sign-in. Verify syncing on two devices before adding real tenant data. Photos and signed documents can be linked to private OneDrive files. Files remain in OneDrive.</p></div>`}function restore(e){let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!Array.isArray(v.units)||v.units.length!==7||!Array.isArray(v.payments)||!Array.isArray(v.expenses))throw Error('Invalid backup');if(confirm('Replace all local data with this backup?')){state=v;save();go('Dashboard')}}catch(err){alert('This is not a valid Gideon Rental Property Manager backup.')}};reader.readAsText(file)}

const authorizedIds=new Set(['J0vVl3nwvdPYH9qGpEc7FbJdUJs2','LmgacBYbS4eRQxEcPoed43Empfm2']);
let cloudReady=false,unsubscribe=null,writeTimer=null,remoteDoc=null,lastWritten='',pendingWrite=false;
function statusText(t){document.getElementById('syncStatus').textContent=t}
function queueCloudSave(){if(!cloudReady||!remoteDoc)return;pendingWrite=true;statusText('Saving…');clearTimeout(writeTimer);writeTimer=setTimeout(async()=>{const payload=JSON.stringify(state);try{await remoteDoc.set({payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});lastWritten=payload;pendingWrite=false;statusText('Synced ✓')}catch(e){statusText('Save failed — retry');alert('Cloud save failed: '+e.message)}},450)}
function boot(){try{firebase.initializeApp(firebaseConfig)}catch(e){document.getElementById('loginMessage').textContent='Firebase initialization failed: '+e.message;return}
 document.getElementById('loginMessage').textContent='Enter your email and password.';
 document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();document.getElementById('loginMessage').textContent='Signing in…';try{await firebase.auth().signInWithEmailAndPassword(document.getElementById('loginEmail').value.trim(),document.getElementById('loginPassword').value)}catch(err){document.getElementById('loginMessage').textContent=err.message}});
 firebase.auth().onAuthStateChanged(async user=>{cloudReady=false;clearTimeout(writeTimer);pendingWrite=false;if(unsubscribe){unsubscribe();unsubscribe=null}if(!user){remoteDoc=null;document.getElementById('loginGate').style.display='flex';document.getElementById('logoutBtn').style.display='none';statusText('Signed out');return}

 document.getElementById('loginMessage').textContent='Loading shared rental records…';statusText('Loading…');remoteDoc=firebase.firestore().collection('rentalManager').doc('sharedData');
 unsubscribe=remoteDoc.onSnapshot(snap=>{if(pendingWrite)return;try{if(snap.exists){const data=snap.data();if(!data||!data.payload)throw Error('Missing data');const next=JSON.parse(data.payload);if(!Array.isArray(next.units)||next.units.length!==7||!Array.isArray(next.payments)||!Array.isArray(next.expenses))throw Error('Unexpected cloud data');state=next}else{state=blank()}cloudReady=true;document.getElementById('loginGate').style.display='none';document.getElementById('logoutBtn').style.display='inline-block';statusText(snap.exists?'Synced ✓':'Ready — no cloud records yet');render()}catch(err){cloudReady=false;statusText('Data error');alert('Unable to load shared records: '+err.message)}},err=>{cloudReady=false;statusText('Sync error');document.getElementById('loginMessage').textContent='Unable to access shared data: '+err.message;document.getElementById('loginGate').style.display='flex'})
 });}
